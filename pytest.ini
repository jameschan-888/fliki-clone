[pytest]

# R17 (rev40): pytest-xdist 并行, 见 backend/requirements-dev.txt
# -n auto 用 CPU 核数; --dist=loadfile 让同文件内 test 串行 (防 SQLite 锁)
addopts = -n auto --dist=loadfile
testpaths = backend/tests

# R6 (rev37): test_fallback_when_numpy_or_ssim_missing 故意把 _HAS_NUMPY=False
# 走到 visual_diff_fliki.py 的 Image.getdata() fallback, 这就是要被弃用的 API.
# CI 走 unittest 无此噪音; 本地 pytest 静音 (module 被 spec_from_file_location 加载为 vd)
filterwarnings =
    ignore::DeprecationWarning:tests.e2e.visual_diff_fliki
    ignore::DeprecationWarning:vd

