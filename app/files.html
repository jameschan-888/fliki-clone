<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>我的文件 | 本地视频制作台</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#eef2ff;background:radial-gradient(circle at 20% 0,#293669 0,transparent 38%),#0c1020}
    .shell{max-width:1280px;margin:auto;padding:48px 24px}
    h1{font-size:32px;margin:0 0 8px;letter-spacing:-.5px}
    .lead{color:#aab3cf;font-size:14px;margin:0 0 24px}
    .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 0 24px;padding:14px 16px;border:1px solid #2d3756;border-radius:14px;background:rgba(20,27,49,.5)}
    .toolbar input[type=search]{flex:1;min-width:240px;padding:9px 14px;background:rgba(20,27,49,.7);border:1px solid #3a4a7c;border-radius:10px;color:#eef2ff;font-size:14px;outline:none}
    .toolbar input[type=search]:focus{border-color:#5b6cff}
    .toolbar button{padding:9px 16px;background:transparent;border:1px solid #3a4a7c;border-radius:10px;color:#cfd5ee;font-size:13px;font-weight:600;cursor:pointer}
    .toolbar button:hover{border-color:#5b6cff;color:#718cff}
    .toolbar button.primary{background:#5b6cff;border-color:#5b6cff;color:#fff}
    .toolbar button.primary:hover{background:#718cff}
    .tabs{display:flex;gap:8px;margin:0 0 18px}
    .tab{padding:9px 18px;background:transparent;border:1px solid #2d3756;border-radius:10px;color:#aab3cf;font-size:13px;font-weight:600;cursor:pointer}
    .tab.active{border-color:#5b6cff;color:#fff;background:rgba(91,108,255,.15)}
    .view-toggle{display:flex;gap:4px;padding:4px;background:rgba(20,27,49,.7);border:1px solid #3a4a7c;border-radius:10px}
    .view-toggle button{padding:6px 12px;background:transparent;border:none;border-radius:8px;color:#aab3cf;font-size:12px;cursor:pointer}
    .view-toggle button.active{background:#5b6cff;color:#fff}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
    .file-card{display:block;padding:14px;border:1px solid #2d3756;border-radius:12px;background:rgba(20,27,49,.4);text-decoration:none;color:inherit;transition:.15s transform,.15s border-color;position:relative}
    .file-card:hover{transform:translateY(-2px);border-color:#718cff}
    .file-thumb{height:120px;border-radius:8px;background:linear-gradient(145deg,rgba(91,108,255,.18),rgba(19,25,44,.95));display:flex;align-items:center;justify-content:center;font-size:42px;margin-bottom:10px}
    .file-thumb.video{background:linear-gradient(145deg,rgba(220,80,80,.18),rgba(19,25,44,.95))}
    .file-thumb.audio{background:linear-gradient(145deg,rgba(72,213,139,.18),rgba(19,25,44,.95))}
    .file-thumb.design{background:linear-gradient(145deg,rgba(255,170,40,.18),rgba(19,25,44,.95))}
    .file-tag{position:absolute;top:18px;right:18px;padding:3px 8px;background:rgba(20,27,49,.85);border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#8ba7ff}
    .file-title{font-weight:600;font-size:14px;margin:0 0 4px;color:#eef2ff}
    .file-meta{display:flex;justify-content:space-between;color:#9da8c5;font-size:11px;margin-top:6px}
    .list-view{display:flex;flex-direction:column;gap:6px}
    .file-row{display:grid;grid-template-columns:40px 2fr 1fr 1fr 100px 60px;gap:14px;align-items:center;padding:10px 14px;border:1px solid #2d3756;border-radius:10px;background:rgba(20,27,49,.4)}
    .file-row .ico{font-size:24px}
    .file-row .meta{color:#9da8c5;font-size:12px}
    .file-row .actions{display:flex;gap:6px}
    .file-row .actions button{padding:5px 10px;background:transparent;border:1px solid #3a4a7c;border-radius:6px;color:#aab3cf;font-size:11px;cursor:pointer}
    .empty{padding:48px;text-align:center;color:#6b748d;border:1px dashed #2d3756;border-radius:14px}
    .empty h3{margin:0 0 6px;color:#aab3cf;font-size:18px}
    .check{padding:5px 10px;border:1px solid #3a4a7c;border-radius:6px;color:#cfd5ee;background:transparent;cursor:pointer;font-size:12px}
    .check.on{background:#5b6cff;border-color:#5b6cff;color:#fff}
    .bulk{margin-left:auto;display:flex;gap:8px;align-items:center}
    .bulk .count{color:#9da8c5;font-size:12px}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main_files.tsx"></script>
</body>
</html>
