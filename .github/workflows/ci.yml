name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app deps
        run: npm ci --prefix app
      - name: TypeScript + Vite build
        run: npm run build --prefix app
      - name: Vitest
        run: npm test --prefix app -- --run
      - name: Install Python deps for visual diff
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          playwright install chromium --with-deps
      - name: Template preview smoke (must pass before full render)
        run: python tests/e2e/test_template_preview_smoke.py
      - name: Visual diff (pixel regression, 0.1% threshold)
        run: cd tests/e2e && python visual_diff.py --threshold 0.001
      - name: Template full render E2E
        run: python tests/e2e/test_template_render_e2e.py
