name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  routes:
    name: Router check (check_routes.py)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: scripts/check_routes.py --fail-on-warn
        run: python scripts/check_routes.py --fail-on-warn

      - name: scripts/enum_routers.py --check-routes (rev39 R12 gate)
        run: python scripts/enum_routers.py --check-routes

  backend:
    name: Backend unit + API + Provider + Remotion tsc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/workers/remotion-project/package-lock.json
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Install backend deps (needed for init_db + uvicorn)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Init DB schema + seed (idempotent for fresh checkout)
        run: |
          cd backend
          python ../scripts/ci_init_db.py
      - name: Start backend in background (live HTTP for integration tests)
        run: |
          cd backend
          FLIKI_DISABLE_RATE_LIMIT=1 nohup python -m uvicorn main:app --host 127.0.0.1 --port 5181 --log-level warning > /tmp/backend.log 2>&1 &
          echo "started pid $!"
      - name: Wait for backend /health (max 30s)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5181/health > /dev/null; then
              echo "backend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend not ready, last log:"
          tail -50 /tmp/backend.log
          exit 1
      - name: Debug - verify templates.json + db presence
        run: |
          echo "[debug] ls -la backend/data:"
          ls -la backend/data/ || true
          echo "[debug] head templates.json:"
          head -3 backend/data/templates.json 2>&1 || true
          echo "[debug] wc -c templates.json:"
          wc -c backend/data/templates.json 2>&1 || true
          echo "[debug] ls backend/db:"
          ls backend/db/ 2>&1 || true
          echo "[debug] DB tables:"
          python -c "import sqlite3; c=sqlite3.connect('backend/data/app.db'); print([r[0] for r in c.execute('SELECT name FROM sqlite_master WHERE type=\'table\'')])"
      - name: Backend unit tests (discover)
        run: |
          cd backend
          python -W ignore::ResourceWarning -c "from templates_router import TEMPLATES_FILE, load_builtin_templates; print('TEMPLATES_FILE=', TEMPLATES_FILE); print('exists=', TEMPLATES_FILE.exists()); print('size=', TEMPLATES_FILE.stat().st_size if TEMPLATES_FILE.exists() else 0); print('builtin_count=', len(load_builtin_templates()))"
          python -W ignore::ResourceWarning -m unittest discover -s tests -p "test_*.py" -t .
      - name: API contract
        run: cd backend && python -m unittest tests.test_api_contract
      - name: Provider real matrix (network, may flake)
        run: cd backend && python -W ignore::ResourceWarning -m unittest tests.providers.test_real_provider_matrix
        continue-on-error: true
      - name: Remotion tsc
        run: |
          cd backend/workers/remotion-project
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx tsc --noEmit -p .

  frontend:
    name: Frontend build + vitest + visual diff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps (needed for init_db + uvicorn)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Init DB schema + seed (idempotent for fresh checkout)
        run: |
          cd backend
          python ../scripts/ci_init_db.py
      - name: Start backend in background (live HTTP for preview smoke + visual diff)
        run: |
          cd backend
          FLIKI_DISABLE_RATE_LIMIT=1 nohup python -m uvicorn main:app --host 127.0.0.1 --port 5181 --log-level warning > /tmp/backend.log 2>&1 &
          echo "started pid $!"
      - name: Wait for backend /health (max 30s)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5181/health > /dev/null; then
              echo "backend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend not ready, last log:"
          tail -50 /tmp/backend.log
          exit 1
      - name: Install app deps
        run: npm ci --prefix app
      - name: TypeScript + Vite build
        run: npm run build --prefix app
      - name: Vitest
        run: npm test --prefix app -- --run
      - name: Template preview smoke
        run: python tests/e2e/test_template_preview_smoke.py
      - name: Visual diff (Playwright docker image, 1% threshold)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work/tests/e2e \
            mcr.microsoft.com/playwright/python:v1.49.0-jammy \
            sh -c "pip install --quiet Pillow playwright && python -m playwright install --with-deps chromium && python visual_diff.py --threshold 0.01"
      - name: Install ffmpeg (for Template full render E2E)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Template full render E2E (auth + 5 scenes render)
        run: python tests/e2e/test_template_render_e2e.py
        timeout-minutes: 25
        continue-on-error: true  # render 是真渲染 5 段视频, 慢且资源敏感; 失败不阻塞 PR

  cron-ps1-windows:
    name: Cron ps1 drill (Windows runner, positive validation)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: python -m pip install --upgrade pip; python -m pip install -r backend/requirements.txt
      - name: Init DB schema + seed (idempotent)
        run: python scripts/ci_init_db.py
      - name: Run cron-ps1 drill test
        # backend/tests/test_p1c_backup_drill.py::P1CDRDrillTests::test_drill_runs_in_cron_ps1
        # 用 @unittest.skipUnless(sys.platform=="win32") 装饰; Linux runner 永远 skip.
        # windows-latest 做正向验证.
        # shell: cmd 不是 PowerShell -- PS 5.1 把 unittest 的 stderr 报成 NativeCommandError,
        # 把 AssertionError/traceback 吞掉. cmd 的 2>&1 是真重定向, 完整保留 stderr.
        shell: cmd
        run: cd backend && python -m unittest tests.test_p1c_backup_drill.P1CDRDrillTests.test_drill_runs_in_cron_ps1 -v 2>&1
